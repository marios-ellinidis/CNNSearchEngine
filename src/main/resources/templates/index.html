<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CNN Keyword Searching</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const titleElement = document.querySelector('title');
            const cnnColor = "#cc0000";
            let titleText = titleElement.innerHTML;
            titleText = titleText.replace("CNN", `<span style="color:${cnnColor};">CNN</span>`);
            const titleInPage = document.getElementById('page-title');
            titleInPage.innerHTML = titleText;
        });
    </script>
    <style>
        .custom-checkbox {
            display: flex;
            align-items: center;
            position: relative;
            padding-left: 1.5rem;
            cursor: pointer;
            user-select: none;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .custom-checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .custom-checkbox .checkmark {
            position: absolute;
            left: 0;
            top: 1px;
            height: 11px;
            width: 11px;
            background-color: white;
            border: 2px solid #cc0000;
            border-radius: 4px;
        }

        .custom-checkbox input:checked ~ .checkmark {
            background-color: #cc0000;
        }

        .custom-checkbox .checkmark::after {
            content: "";
            position: absolute;
            display: none;
        }

        .custom-checkbox input:checked ~ .checkmark::after {
            display: block;
        }

        .custom-checkbox .checkmark::after {
            left: 3px;
            top: -3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            color: black;
        }

        h1 span {
            color: #cc0000;
        }

        label {
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0 1rem 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        select {
            width: 100%;
            padding: 0.75rem 0.5rem;
            margin: 0.5rem 0 1rem 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            height: 3rem;
        }

        button {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 0;
            width: 200px;
            height: 40px;
            font-size: 1rem;
            letter-spacing: 4px;
            border-radius: 0px;
            cursor: pointer;
            justify-content: center;
        }

        button:hover {
            background-color: #a30000;
        }

        .error {
            color: red;
            margin-top: 1rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-history-item {
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
            padding: 0.75rem 0;
            border-bottom: 1px solid #ddd;
            animation-delay: calc(0.12s * var(--i));
        }
    </style>
</head>
<body>
    <h1 id="page-title">CNN Articles Search</h1>

    
    <form action="/search" method="post" style="display: inline;">
        <label for="query">Search Query</label>
        <input type="text" id="query" name="query" required>
    
        <label for="field">Search In</label>
        <select id="field" name="field">
            <option value="All">All Fields</option>
            <option value="Headline">Headline</option>
            <option value="Description">Description</option>
            <option value="Content">Content</option>
            <option value="Keywords">Keywords</option>
            <option value="Second Headline">Second Headline</option>
            <option value="Author">Author</option>
            <option value="Category">Category</option>
            <option value="Section">Section</option>
            <option value="datePublished">Date Published (yyyy-MM-dd)</option>
        </select>
    
        <label class="custom-checkbox">
            <input type="checkbox" name="includeSynonyms" id="includeSynonyms">
            <span class="checkmark"></span>
            Include Synonyms
        </label>
    
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <button type="submit">Search</button>
        </div>
    </form>
    
    <!-- Now place this OUTSIDE the above form but styled next to it -->
    <form action="/vector" method="get" style="display: inline;">
        <button type="submit" style="
            background-color: black;
            color: white;
            border: none;
            padding: 0;
            width: 200px;
            height: 42px;
            font-size: 0.9rem;
            letter-spacing: 0px;
            border-radius: 0px;
            cursor: pointer;
            justify-content: center;
            margin-left: 0rem;
            margin-top: -1rem;
        ">
            Switch to Vector Searching
        </button>
    </form>
    
    

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <div style="margin-top: 3rem;">
        <h2 style="color: #cc0000;">Recent Searches</h2>
        <ul th:if="${history}" style="list-style-type: none; padding-left: 0;">
            <li th:each="item, iterStat : ${history}"
                th:text="${item}"
                th:attr="style=${'--i:' + (iterStat.index + 1)}"
                class="search-history-item">
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(history)}">No recent searches.</p>
    </div>
</body>
</html>
